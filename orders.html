    <style>
        body{
            background-color:#f7f4ed;
        }
        a{
            text-decoration: none;
            color:black;
        }
        #box{
            width:16px;
            height:auto;
        }
        button{
            background-color:#f7f4ed;
            display:flex;
            align-self:center;
            justify-self: center;
        }
        @media(min-width:760px){
            #box{
                height:36px;
                width:36px;

            }
            #location{
                width:23px;
                height:auto;
            }
            #delivery{
                width:48px;
                height:auto;
            }
        }
        #animated{
            width:auto;
            height:600px;
            background:linear-gradient(#f7f4ed,goldenrod);
            display: flex;
            justify-content:center ;
            align-content: center;
            color:rgba(92, 43, 3, 0.589);
        }
        #maps{
            justify-content: center;
            align-content: center;
            background:linear-gradient(goldenrod,#f7f4ed,goldenrod);
            height:400px;
            width:220px;
            margin-top:20px;
            border:16px solid black;
            border-radius: 50px;
            overflow: hidden;
        }
        .dots{
            animation-name:appear;
            animation-duration:5s;
            animation-delay: 1.2s;
            opacity:0%;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }
        @keyframes appear{
            0%{opacity:0%;}
            20%,80%{opacity:100%;}
            100%{opacity: 0%;}
        }
        #delivery{
            animation-name:run;
            animation-duration:3s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }
        @keyframes run{
            0%{
                margin-left:0px;
                opacity:0%;
            }
            10%{
                opacity:100%;
                margin-left: 50px;
            }
            50%,100%{
                margin-left:50px;
                opacity: 0%;
            }
        }
        .delivery_2{
            animation-name:run2;
            animation-duration:3s;
            animation-delay:1.2s;
            animation-iteration-count: infinite;
            opacity:0%;
        }
        @keyframes run2{
            0%{opacity:0%;}
            100%{opacity:100%;
            margin-left:0px;}
        }
    </style>
